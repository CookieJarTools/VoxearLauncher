[package]
name = "voxear_launcher"
description = "The Voxear Launcher core: engine releases, installs, projects and the new-project flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
jiff.workspace = true
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
zstd.workspace = true

# Only for the `testing` feature: fake signed releases for tests and local trials.
minisign = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }

[features]
testing = ["dep:minisign"]

[[example]]
name = "fake_release"
required-features = ["testing"]

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
