[package]
name = "voxear_release"
description = "Signs Voxear engine and launcher releases and writes the manifests the launcher reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "voxear-release"
path = "src/main.rs"

[dependencies]
voxear_launcher.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
jiff.workspace = true
minisign.workspace = true
semver.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
voxear_launcher = { workspace = true, features = ["testing"] }
tempfile.workspace = true
