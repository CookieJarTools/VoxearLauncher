[package]
name = "voxear-launcher"
description = "The Voxear Launcher window"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/CookieJarTools/VoxearLauncher"
publish = false

# Its own workspace, so `cargo test` at the repository root never needs a built front end.
[workspace]

[lib]
# The `_lib` suffix keeps the library name apart from the binary's on Windows (rust-lang/cargo#8519).
name = "voxear_launcher_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
voxear_launcher = { path = "../../crates/voxear_launcher" }
anyhow = "1"
dirs = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
voxear_launcher = { path = "../../crates/voxear_launcher", features = ["testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
